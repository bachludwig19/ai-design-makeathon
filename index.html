<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetFlow Alpine · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<style>
  /* Home declutter (controller, 2026-11-11): one purpose line, one action, fewer words. */
  .ask .purpose{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:clamp(22px,3vw,32px);line-height:1.2;letter-spacing:.01em;margin:0 0 18px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45);max-width:720px}
  .goal-card{min-height:150px}
  .goal-card h3{margin-bottom:14px}
  .goal-card.inert,.more-inert{opacity:.45!important;filter:grayscale(1);cursor:not-allowed}
  .goal-card.inert:hover{transform:none;box-shadow:none}
  .more-inert{font-size:13px;color:var(--text-3);padding:10px 4px}
  /* Landing (controller, 2026-11-11): plain greeting + what needs you. No photo (user). */
  body[data-page="home"] .ask{background:none;outline:none;box-shadow:none;animation:none;margin:0;min-height:0;padding:28px 0 0;
    display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px}
  body[data-page="home"] .ask-box{order:3;flex:1 1 100%;max-width:none;background:var(--card);border:1px solid rgba(var(--gold-rgb),.45);box-shadow:var(--shadow)}
  body[data-page="home"] #ask-out{order:4;flex:1 1 100%}
  body[data-page="home"] .ai-answer{max-width:none;margin:0}
  body[data-page="home"] .ask [hidden]{display:none!important}
  body[data-page="home"] .ask h1.hello-h{display:block!important;margin:0;color:var(--text);font-family:var(--display);font-stretch:112%;font-weight:600;font-size:clamp(24px,2.4vw,32px);letter-spacing:.01em}
  .hello-s{margin:8px 0 0;color:var(--text-2);font-size:16px}
  .ask .hero-cta{margin:0}
  body[data-page="home"] #dash .health{order:0;margin:28px 0 0}
</style>
</head>
<body data-page="home" data-crumb="Workspace / Autonomous Pipeline">
<div class="app">
  <aside id="mf-nav"></aside>
  <div class="main">
    <header id="mf-top"></header>
    <main class="content">
      <section class="ask">
        <div class="hello">
          <h1 class="hello-h">Good evening, Alex.</h1>
          <p class="hello-s" id="hello-s"></p>
        </div>
        <div class="hero-cta"><a class="btn btn-white" href="canvas.html">Build a workflow <span class="hero-arrow"></span></a></div>
        <form class="ask-box" id="ask">
          <span id="ask-ic"></span>
          <input id="ask-in" placeholder="Describe your goal, and I’ll draft the workflows for you…" autocomplete="off">
          <button class="btn btn-primary" type="submit">Draft workflows <span id="ask-arrow"></span></button>
        </form>
        <div id="ask-out"></div>
        <div class="persona" hidden>
          <span class="persona-chip" id="persona-chip"></span>
          <a href="#" class="link-u" id="persona-btn" aria-haspopup="true" aria-expanded="false">Change persona</a>
          <div class="persona-menu" id="persona-menu" role="menu"></div>
        </div>
      </section>

      <div id="dash">
        <section class="panel health" style="display:none">
          <div class="health-legend"><span id="h-on"></span><span id="h-risk"></span><span id="h-off"></span></div>
          <div class="health-bar" id="health-bar">
            <i style="background:var(--teal);flex-grow:0"></i><i style="background:var(--risk);flex-grow:0"></i><i style="background:var(--danger);flex-grow:0"></i>
          </div>
        </section>

        <div class="sec-head"><h2 class="h-sec">Needs your attention</h2></div>
        <section id="attention"></section>

        <div class="sec-head"><h2 class="h-sec" id="goals-h"></h2></div>
        <section class="goals" id="goals"></section>
      </div>
    </main>
  </div>
</div>
<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/brand.js"></script>
<script src="assets/tour.js"></script>
<script>
(function () {
  const { icon, esc, toast, persona, setPersona, isResolved, goalNow } = MFApp;
  const $ = (s) => document.querySelector(s);
  $("#ask-ic").innerHTML = icon("sparkles", "ic-lg");
  $("#ask-arrow").innerHTML = icon("arrow", "ic-sm");
  document.querySelectorAll(".hero-arrow").forEach((e) => (e.innerHTML = icon("arrow", "ic-sm")));

  // Persona-specific view. Product Manager is the wired path; its delivery goal reflects the workflow decisions.
  function view(name) {
    const p = JSON.parse(JSON.stringify(MF.personas[name]));
    if (name === "Product Manager") {
      const g = goalNow();
      const d = p.goals.find((x) => x.id === "delivery");
      d.status = g.status; d.progress = g.progress;
      if (g.resolved) {
        d.desc = "Owners confirmed for all " + MF.actionItems.length + " stalled items. Tickets synced to Jira.";
        p.health.onTrack += 1; p.health.atRisk -= 1;
        p.attention = p.attention.filter((a) => a.id !== "delivery");
        p.cleared = true;
      }
    }
    p.attention.forEach((a) => { a.desc = a.desc.replace("{n}", MF.actionItems.length); });
    return p;
  }
  const label = { "on-track": "On track", "at-risk": "At risk", "off-track": "Off track" };
  const barTone = { "on-track": "teal", "at-risk": "risk", "off-track": "off" };

  function render(name, animate) {
    const p = view(name);
    $("#persona-chip").textContent = name;
    $("#goals-h").textContent = "Your goals";
    $("#hello-s").textContent = p.cleared ? "All your goals are moving. Your agents have it from here."
      : "Your agents are running 10 goals. 1 needs a decision from you.";
    const h = p.health;
    $("#h-on").textContent = `${h.onTrack} On track`;
    $("#h-risk").textContent = `${h.atRisk} At risk`;
    $("#h-off").textContent = `${h.offTrack} Off track`;
    const bars = $("#health-bar").children;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bars[0].style.flexGrow = h.onTrack; bars[1].style.flexGrow = h.atRisk; bars[2].style.flexGrow = h.offTrack;
    }));

    $("#attention").innerHTML =
      (p.cleared ? `<div class="resolved-note fade-in">${icon("checkCircle")}Engineering delivery commitments: you confirmed ${MF.actionItems.length} owners, tickets are in Jira. <a class="link" style="margin-left:auto;color:var(--teal)" href="goal.html">View goal ${icon("arrow", "ic-sm")}</a></div>` : "") +
      `<div class="stagger">` + p.attention.filter((a) => a.href).map((a, i) => `
        <div class="attn">
          <div>
            <div class="attn-title"><span class="tag ${a.tone}">${esc(a.tag)}</span>${esc(a.title)}</div>
            <div class="attn-desc">${esc(a.desc)}</div>
          </div>
          ${a.href
            ? `<a class="btn btn-primary" href="${a.href}">${esc(a.cta)} ${icon("arrow", "ic-sm")}</a>`
            : `<button class="btn ${a.secondary ? "btn-white" : "btn-primary"}" data-stub="${i}">${esc(a.cta)}${a.secondary ? "" : " " + icon("arrow", "ic-sm")}</button>`}
        </div>`).join("") +
      (p.attention.some((a) => !a.href) ? `<div class="more-inert" title="Not available in this demo">+${p.attention.filter((a) => !a.href).length} more · not in this demo</div>` : "") + `</div>`;
    $("#attention").querySelectorAll("[data-stub]").forEach((b) => b.addEventListener("click", () =>
      toast("This path isn't wired in the prototype. Try the delivery goal (Product Manager).", "sparkles")));

    $("#goals").innerHTML = p.goals.map((g) => {
      const tag = g.href ? "a" : "div";
      return `<${tag} class="goal-card ${g.href ? "" : "inert"}" ${g.href ? `href="${g.href}"` : `title="Not available in this demo"`}>
        <div class="top"><span class="pill ${g.status}">${label[g.status]}</span><span>${g.progress}%</span></div>
        <h3>${esc(g.title)}</h3>
        <div class="bar"><i class="${barTone[g.status]}" data-w="${g.progress}"></i></div>
      </${tag}>`;
    }).join("");
    $("#goals").classList.remove("stagger"); void $("#goals").offsetWidth; $("#goals").classList.add("stagger");
    requestAnimationFrame(() => requestAnimationFrame(() =>
      document.querySelectorAll("#goals .bar>i").forEach((b) => (b.style.width = b.dataset.w + "%"))));
  }

  // Persona menu
  const menu = $("#persona-menu"), btn = $("#persona-btn");
  const opts = [
    { n: "Product Manager", s: "Alex Mercer · delivery, discovery, adoption" },
    { n: "Engineering Lead", s: "Coming soon", disabled: true },
    { n: "Customer Success Lead", s: "Coming soon", disabled: true }
  ];
  function drawMenu() {
    const cur = persona();
    menu.innerHTML = opts.map((o) => `<button class="persona-opt ${o.n === cur ? "on" : ""}" role="menuitem" data-p="${o.n}" ${o.disabled ? "disabled" : ""}>
      <span class="avatar sm ${o.disabled ? "gold" : ""}">${MFApp.initials(o.n)}</span>
      <span><div class="t">${o.n}</div><div class="s">${o.s}</div></span>${icon("check", "ic-sm")}</button>`).join("");
  }
  function toggle(open) { menu.classList.toggle("open", open); btn.setAttribute("aria-expanded", open); }
  btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); drawMenu(); toggle(!menu.classList.contains("open")); });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) toggle(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggle(false); });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("[data-p]"); if (!b || b.disabled) return;
    toggle(false);
    if (b.dataset.p === persona()) return;
    setPersona(b.dataset.p);
    const dash = $("#dash");
    dash.classList.add("swap-out");
    setTimeout(() => { render(b.dataset.p); dash.classList.remove("swap-out"); toast(`Switched to ${b.dataset.p}. Same agents, different goals.`, "user"); }, 220);
  });
  $("#dash").style.transition = "opacity .25s, transform .25s";

  // Goal box: describe a goal, the agent drafts workflows for it (simulated), then opens the canvas.
  $("#ask").addEventListener("submit", async (e) => {
    e.preventDefault();
    const goal = $("#ask-in").value.trim() || "Keep product delivery on track";
    const out = $("#ask-out");
    out.innerHTML = `<div class="ai-answer fade-in">${icon("sparkles")}<div class="waiting"><span class="spin"></span>Drafting workflows for “${esc(goal)}”…</div></div>`;
    await new Promise((res) => setTimeout(res, 1200));
    const drafts = [
      ["Action Item Tracking", "turns meeting decisions into owned, dated tickets"],
      ["Sprint Monitoring", "flags scope creep and slipping velocity"],
      ["Dependency Monitoring", "spots cross-team blockers early"]
    ];
    out.innerHTML = `<div class="ai-answer fade-in">${icon("sparkles")}<div style="flex:1">
      <div>Drafted ${drafts.length} workflows for <b>“${esc(goal)}”</b>. Review them, test, then go live.</div>
      <ul style="margin:10px 0 0;padding-left:18px;color:var(--text-2)">${drafts.map(([n, d]) => `<li><b style="color:var(--text)">${n}</b> · ${d}</li>`).join("")}</ul>
      <div class="row" style="margin-top:12px"><a class="btn btn-primary" href="canvas.html">Open drafts ${icon("arrow", "ic-sm")}</a>
      <span class="pill grey" style="margin-left:auto;height:22px;font-size:11.5px">Simulated agent</span></div></div></div>`;
  });

  // Only Product Manager is wired for the demo; fall back if a tab still holds another persona.
  if (opts.some((o) => o.n === persona() && o.disabled)) setPersona("Product Manager");
  render(persona(), true);
})();
</script>
</body>
</html>
